<div class="container-page py-10 md:py-16 grid lg:grid-cols-2 gap-12 items-center max-w-5xl">
  <div class="hidden lg:block">
    <div class="rounded-3xl bg-gradient-to-br from-primary to-primary-hover text-primary-foreground p-10 aspect-square flex flex-col justify-between shadow-elevated">
      <div class="text-4xl font-black leading-tight">Hungry?<br />We got you.</div>
      <div>
        <div class="text-sm opacity-80">Join millions ordering food they love, delivered fast.</div>
      </div>
    </div>
  </div>
  <div class="w-full max-w-md mx-auto">
    <h1 class="text-3xl font-black">Welcome back</h1>
    <p class="text-sm text-muted-foreground mt-1">Log in to continue</p>

    <form (ngSubmit)="submit()" class="mt-6 space-y-4">
      <label class="block">
        <span class="text-xs font-semibold text-muted-foreground">Email</span>
        <div class="mt-1 relative">
          <!-- <lucide-icon name="mail" [size]="16" class="absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground" /> -->
          <input
            pInputText
            type="email"
            required
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            name="email"
            class="w-full pl-10"
            placeholder="you@example.com"
          />
        </div>
      </label>
      <label class="block">
        <span class="text-xs font-semibold text-muted-foreground">Password</span>
        <div class="mt-1 relative">
          <!-- <lucide-icon name="lock" [size]="16" class="absolute left-3 top-1/2 -translate-y-1/2 z-10 text-muted-foreground" /> -->
          <p-password
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            name="password"
            [toggleMask]="true"
            [feedback]="false"
            styleClass="w-full"
            inputStyleClass="w-full pl-10"
            placeholder="••••••••"
          />
        </div>
      </label>
      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2">
          <p-checkbox [binary]="true" [ngModel]="remember()" (ngModelChange)="remember.set($event)" name="remember" /> Remember me
        </label>
        <a class="text-primary hover:underline cursor-pointer">Forgot password?</a>
      </div>
      @if (error()) {
        <div class="rounded-xl bg-destructive/10 border border-destructive/30 text-destructive text-sm px-3 py-2">{{ error() }}</div>
      }
      <button type="submit" [disabled]="loading()" class="btn-brand w-full">{{ loading() ? 'Logging in…' : 'Log in' }}</button>
    </form>

    <p class="mt-6 text-sm text-center text-muted-foreground">
      Don't have an account? <a routerLink="/register" class="text-primary font-semibold hover:underline">Sign up</a>
    </p>
  </div>
</div>
